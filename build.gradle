plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	flatDir {
		dirs 'libs'
	}

	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases/"
	}

	maven {
		name = "Xander Maven"
		url = "https://maven.isxander.dev/releases"
	}

	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}

	maven {
		name = "DevAuth"
		url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
	}
}

loom {
	runs {
		client {
			// Offizieller Microsoft-Account für runClient (Browser-Login, kein Passwort in Gradle).
			vmArg "-Ddevauth.enabled=true"
			vmArg "-Ddevauth.account=main"
		}
		clientAlt {
			client()
			name "Minecraft Client (Zweitaccount)"
			runDir "run-alt"
			vmArg "-Ddevauth.enabled=true"
			vmArg "-Ddevauth.account=alt"
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "maven.modrinth:yacl:${project.yacl_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	compileOnly "com.mojang:brigadier:1.3.10"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// Nur Dev-Laufzeit: Microsoft-Login für runClient, nicht in der gebauten Mod-JAR.
	runtimeOnly "me.djtheredstoner:DevAuth-fabric:1.2.2"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

java {
	// Loom 1.18 and Minecraft 26.3 need a JDK 25 toolchain.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	withSourcesJar()
}

tasks.named('test', Test) {
	useJUnitPlatform()
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}

